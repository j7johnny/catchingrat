services:
  web:
    build:
      context: .
    command: gunicorn config.wsgi:application --bind 0.0.0.0:8000 --timeout 300 --graceful-timeout 30
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND: redis://redis:6379/3
      RUN_MIGRATIONS: "1"
      RUN_COLLECTSTATIC: "1"
    volumes:
      - .:/app
      - app_media:/app/media
      - app_static:/app/staticfiles
    depends_on:
      - postgres
      - redis
    expose:
      - "8000"

  worker:
    build:
      context: .
    command: celery -A config worker -l info -Q celery,extract --concurrency=1 --prefetch-multiplier=1 --max-tasks-per-child=8
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND: redis://redis:6379/3
      RUN_MIGRATIONS: "0"
      RUN_COLLECTSTATIC: "0"
    volumes:
      - .:/app
      - app_media:/app/media
    depends_on:
      - postgres
      - redis

  worker_publish:
    build:
      context: .
    command: celery -A config worker -l info -Q publish --concurrency=1 --prefetch-multiplier=1 --max-tasks-per-child=8
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND: redis://redis:6379/3
      RUN_MIGRATIONS: "0"
      RUN_COLLECTSTATIC: "0"
    volumes:
      - .:/app
      - app_media:/app/media
    depends_on:
      - postgres
      - redis

  beat:
    build:
      context: .
    command: celery -A config beat -l info
    env_file:
      - .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/1
      CELERY_BROKER_URL: redis://redis:6379/2
      CELERY_RESULT_BACKEND: redis://redis:6379/3
      RUN_MIGRATIONS: "0"
      RUN_COLLECTSTATIC: "0"
    volumes:
      - .:/app
      - app_media:/app/media
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: catchingrat
      POSTGRES_USER: catchingrat
      POSTGRES_PASSWORD: catchingrat
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"

  redis:
    image: redis:7-alpine
    expose:
      - "6379"

  nginx:
    image: nginx:1.29-alpine
    depends_on:
      - web
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - app_media:/var/www/media
      - app_static:/var/www/static
    ports:
      - "18080:80"

volumes:
  postgres_data:
  app_media:
  app_static:
