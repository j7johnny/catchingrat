{% extends "base.html" %}

{% block title %}首次開站設定 | CatchingRat{% endblock %}

{% block content %}
<section class="stack">
    <div>
        <p class="eyebrow">First Setup</p>
        <h2>{{ page_title }}</h2>
        <p class="subtle">{{ page_subtitle }}</p>
    </div>
    <form method="post" class="form-card">
        {% csrf_token %}
        {{ form.non_field_errors }}
        {% for field in form %}
            <label class="field">
                <span>{{ field.label }}</span>
                {{ field }}
                {% if field.help_text %}<small class="field-help">{{ field.help_text }}</small>{% endif %}
                {{ field.errors }}
            </label>
        {% endfor %}
        <button type="submit" class="primary-button">建立第一位管理者</button>
    </form>
</section>
{% endblock %}
